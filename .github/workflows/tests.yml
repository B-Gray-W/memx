name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run the test suite
        run: python -m unittest discover -s tests -v

      - name: Install the package
        run: python -m pip install --upgrade pip && python -m pip install .

      - name: Smoke-test the CLI entry point
        run: |
          memx --root "$RUNNER_TEMP/store" context
          memx --root "$RUNNER_TEMP/store" add "Smoke topic" \
            --body "A body long enough to pass the write floor." \
            --hook "when the smoke test runs" --keywords smoke
          memx --root "$RUNNER_TEMP/store" recall "smoke test"
          memx --root "$RUNNER_TEMP/store" lint
